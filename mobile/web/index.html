<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="oil_mitra">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>oil_mitra</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Google Maps on the web: the Maps JavaScript API needs a key, and the key
    must not be committed to GitHub (the built web bundles are tracked). The
    backend serves it from GET /geo/config (same origin), read from the
    GOOGLE_MAPS_API_KEY environment variable on Render. The SDK is loaded
    before Flutter starts so google_maps_flutter_web finds window.google.maps.
    If the key is missing or the script fails, Flutter still boots.
  -->
  <!-- The Flutter build tool injects its bootstrap <script> tag at this token.
       It is kept inside a comment so Flutter does not start before Google Maps
       has loaded; the loader below inserts flutter_bootstrap.js when ready.
       (The token must be present or `flutter build web` does not emit
       flutter_bootstrap.js.) -->
  <!-- {{flutter_bootstrap_js}} -->
  <script>
    (function () {
      var booted = false;
      function boot() {
        if (booted) return;
        booted = true;
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = true;
        document.body.appendChild(s);
      }

      // Never hold the app for more than 8 seconds waiting for the map SDK.
      var guard = setTimeout(boot, 8000);
      function done() {
        clearTimeout(guard);
        boot();
      }

      fetch('/geo/config', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (cfg) {
          if (!cfg || !cfg.key) { done(); return; }
          window.__oilMitraMapLoaded = function () { done(); };
          var s = document.createElement('script');
          s.src = 'https://maps.googleapis.com/maps/api/js?key=' +
            encodeURIComponent(cfg.key) + '&loading=async&callback=__oilMitraMapLoaded';
          s.async = true;
          s.onerror = done;
          document.head.appendChild(s);
        })
        .catch(done);
    })();
  </script>
</body>
</html>
